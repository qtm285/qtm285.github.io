name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Everything committed here is uploaded as-is, so this is the one point
      # that sees every change however it was made. The assemble step in
      # build-site.py runs the same check, but the record shows most updates are
      # published by hand and never go through it.
      - name: Refuse to publish worked solutions
        run: python3 check-published-tree.py --site-dir static
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
