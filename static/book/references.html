  function reportKatexError(tex, err) {

      // used fifty times is one defect, not fifty cards.

function toggleDrawable(id) {
  var overlay = document.getElementById(id);
  var btn = overlay.nextElementSibling;
  var resetBtn = overlay.resetBtn;
  
  // Lazy init on first click
  if (!overlay.dataset.drawableInit) {
    initDrawable(id);
  }
  
  var isDrawing = overlay.dataset.drawing === 'true';
  var syncCamera = overlay.dataset.syncCamera === 'true';
  if (!isDrawing) {
    // Enable drawing mode
    overlay.dataset.drawing = 'true';
    overlay.style.pointerEvents = 'auto';
    // Reveal walks up from the touch target looking for this attribute, so it
    // covers every touch landing on the tldraw surface. Without it a pen stroke
    // across the figure swipes the slide.
    overlay.setAttribute('data-prevent-swipe', '');
    btn.textContent = '✕';
    if (resetBtn) {
      resetBtn.style.pointerEvents = 'auto';
    }
    // Add drawing-active class after a delay to let TLDraw mount
    setTimeout(function() {
      overlay.classList.add('drawing-active');
    }, 100);
    Drawable.setDrawingMode(id, true);
    if (syncCamera) {
      Drawable.setCameraActive(id, true);
    }
  } else {
    // Disable drawing mode (but keep canvas visible)
    overlay.dataset.drawing = 'false';
    overlay.style.pointerEvents = 'none';
    overlay.removeAttribute('data-prevent-swipe');
    overlay.classList.remove('drawing-active');
    btn.textContent = '✏️';
    if (resetBtn) {
      resetBtn.style.pointerEvents = 'none';
    }
    Drawable.setDrawingMode(id, false);
    if (syncCamera) {
      Drawable.setCameraActive(id, false);
    }
  }
}

  function contentHeight() {

      document.body.offsetHeight,

  // restored in the same synchronous pass, so no paint happens in between.
  // Note: toggling the Bootstrap active class (not inline display) is what
  // makes the pane visible — the hiding rule targets panes without the
  // active class, which outranks any inline display value.
  // The reveal must be isolated, not stacked: activating the hidden pane
  // alongside the currently-active sibling lays both out, and the revealed
  // content measures below the sibling's (measured: y=7456 stacked against
  // a true y=6833). Park the active siblings while measuring, restoring each
  // pane's exact classes afterwards.

    // in each of its tabsets — snapshot each once, then swap: deactivating
    // and snapshotting interleaved would catch an already-revealed pane in a
    // nested tabset and measure it hidden again.
    var parked = [];
    var seen = [];

      var tabset = pane.closest('.panel-tabset') || pane.parentElement;

        pane: p,
        active: p.classList.contains('active'),
        show: p.classList.contains('show'),

      p.classList.remove('active');
      p.classList.remove('show');

      pane.classList.add('show');

  // Report figure positions and hide originals (replaced by TLDraw shapes on canvas)

    var y = 0;
    while (el) {
      y += el.offsetTop || 0;
      el = el.offsetParent;
    }
    return y;
  }

    var x = 0;
    while (el) {
      x += el.offsetLeft || 0;
      el = el.offsetParent;
    }

  // image figure was hidden here and redrawn over the page on a plate, and an
  // inline SVG got a transparent pane over it that turned the wheel into a
  // zoom of that figure. The plates trailed the text after every reflow and the
  // panes took the wheel away from the canvas (Skip: "some images take scroll",
  // "misplaced white plate scrolling svgs"; "ZOOM WORKS ON THE FULL CANVAS").
  //
  // What remains: inline SVGs are made to scale with their container, and the
  // page still says it has no figures to lift. That empty report, under a key,
  // is what retires the figure records earlier loads left in the room.

    var inlineSvgs = document.querySelectorAll('div.inlined-svg > svg');

      svg.style.height = 'auto';

      svg.removeAttribute('height');

      window.parent.postMessage({ type: 'tlda-figures', shapeId: shapeId, figuresKey: 'in-page', figures: [] }, '*');
    }
  }

    placeholders.forEach(function(el) {

      var cells = container.querySelectorAll('.image-toggle-cell');
      var imgUrls = Array.from(cells).map(function(cell) {
        var img = cell.querySelector('img');
        if (img) return img.src;
        var inlineSvg = cell.querySelector('div.inlined-svg > svg');
        if (inlineSvg) {
          var serialized = new XMLSerializer().serializeToString(inlineSvg);
          return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(serialized)));
        }
        return '';
      });

      // Find step text elements — location depends on layout:
      // Sidebar: moved into .image-toggle-sidebar > .image-toggle-steps
      // Non-sidebar: still siblings of the container
      var stepTextEls = [];
      var sidebar = container.closest('.image-toggle-sidebar');
      if (sidebar) {
        var stepsCol = sidebar.querySelector('.image-toggle-steps');
        if (stepsCol && stepSel) {
          stepTextEls = Array.from(stepsCol.querySelectorAll(stepSel));
        }
      } else if (stepSel) {
        var sibling = container.nextElementSibling;
        while (sibling) {
          if (sibling.matches && sibling.matches(stepSel)) {
            stepTextEls.push(sibling);
          } else if (stepTextEls.length > 0) {
            break;
          }
          sibling = sibling.nextElementSibling;
        }
      }

      // Build steps array
      var numSteps = Math.max(imgUrls.length, stepTextEls.length, labels.length);
      if (numSteps === 0) return;

      var steps = [];
      for (var s = 0; s < numSteps; s++) {
        var stepEl = stepTextEls[s];
        var stepY = stepEl ? getOffsetY(stepEl) : containerY;
        // Extract bold lead-in as label, remainder as text
        var stepLabel = labels[s] || ('Step ' + (s + 1));
        var stepText = '';
        if (stepEl) {
          var strong = stepEl.querySelector('strong, b');
          if (strong) {
            stepLabel = strong.textContent.replace(/[.s]+$/, '');
            // Get text after the bold element
            var clone = stepEl.cloneNode(true);
            var boldClone = clone.querySelector('strong, b');
            if (boldClone) boldClone.remove();
            stepText = clone.textContent.trim();
          } else {
            stepText = stepEl.textContent.trim();
          }
        }
        steps.push({
          y: stepY,
          label: stepLabel,
          imageUrl: imgUrls[s] || imgUrls[0] || '',
          text: stepText,
        });
      }

      // Click step text → switch figure + highlight active step
      var cellArr = Array.from(cells);
      var stepArr = Array.from(stepTextEls);
      // Mark first step as active initially
      if (stepArr.length > 0) {
        var activeIdx = cellArr.findIndex(function(c) { return c.classList.contains('active'); });
        if (activeIdx >= 0 && activeIdx < stepArr.length) {
          stepArr[activeIdx].classList.add('scrolly-active');
        }
      }
      for (var s2 = 0; s2 < stepArr.length; s2++) {
        (function(stepIdx) {
          stepArr[stepIdx].addEventListener('click', function() {
            for (var c = 0; c < cellArr.length; c++) {
              cellArr[c].classList.toggle('active', c === stepIdx);
            }
            for (var t = 0; t < stepArr.length; t++) {
              stepArr[t].classList.toggle('scrolly-active', t === stepIdx);
            }
          });
        })(s2);
      }

      // Region bounds: top of container to bottom of last step element
      var startY = containerY;
      var endY = containerY + (container.offsetHeight || 200);
      // For sidebar, use the sidebar wrapper bounds
      if (sidebar) {
        startY = getOffsetY(sidebar);
        endY = startY + sidebar.offsetHeight;
      }
      if (stepTextEls.length > 0) {
        var lastEl = stepTextEls[stepTextEls.length - 1];
        var lastY = getOffsetY(lastEl) + lastEl.offsetHeight;
        if (lastY > endY) endY = lastY;
      }

      regions.push({
        id: container.id || ('scrolly-' + idx),
        startY: startY,
        endY: endY,
        steps: steps,
      });
    });

    if (regions.length > 0 && window.parent !== window) {
      window.parent.postMessage({
        type: 'tlda-scrolly-regions',
        shapeId: shapeId,
        regions: regions,
      }, '*');
    }
  }

  // Install parent listeners on DOMContentLoaded, then measure
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      installCanvasListeners();
      hideEmbeddedTocs();
      letCanvasShowThrough();
      // processWebRCells(); // Disabled — live-html includes WebR runtime
      // Early reports for fast anchor resolution, later reports for render accuracy
      setTimeout(reportHeight, 200);
      setTimeout(reportHeight, 500);
      setTimeout(reportHeight, 2000);
      setTimeout(reportHeight, 5000);
      setTimeout(reportHeadings, 200);
      setTimeout(reportHeadings, 1000);
      setTimeout(reportHeadings, 3000);
      setTimeout(reportHeadings, 6000);
      setTimeout(reportScrollyRegions, 200);
      setTimeout(reportScrollyRegions, 1000);
      setTimeout(reportScrollyRegions, 3000);
      setTimeout(reportFigures, 500);
      setTimeout(reportFigures, 2000);
      setTimeout(reportFigures, 5000);
      setTimeout(reportMermaidDiagrams, 500);
      setTimeout(reportMermaidDiagrams, 2000);
      setTimeout(reportMermaidDiagrams, 5000);
    });
  } else {
    installCanvasListeners();
    hideEmbeddedTocs();
    letCanvasShowThrough();
    // processWebRCells(); // Disabled — live-html includes WebR runtime
    setTimeout(reportHeight, 100);
    setTimeout(reportHeight, 2000);
    setTimeout(reportHeadings, 500);
    setTimeout(reportHeadings, 2500);
    setTimeout(reportScrollyRegions, 500);
    setTimeout(reportScrollyRegions, 2500);
    setTimeout(reportFigures, 500);
    setTimeout(reportFigures, 2000);
    setTimeout(reportMermaidDiagrams, 500);
    setTimeout(reportMermaidDiagrams, 2000);
  }

  // Observe DOM mutations (webR output, KaTeX rendering, etc.)
  var lastHeight = 0;
  var debounceTimer = null;
  var observer = new MutationObserver(function(mutations) {
    // A tab pane becoming active changes which figures are on screen, and the
    // load-time reports only ever covered the pane that was active at load —
    // nothing else publishes figures afterwards, so a pane opened later would
    // keep whatever record an earlier report left at its figures' indices.
    // Re-report here instead. Only a class change on a pane that is active now
    // counts, so figure style writes (which never touch a pane's class) cannot
    // re-enter this.
    for (var mi = 0; mi < mutations.length; mi++) {
      var mt = mutations[mi];
      if (mt.type === 'attributes' && mt.attributeName === 'class' &&
          mt.target && mt.target.classList &&
          mt.target.classList.contains('tab-pane') &&
          mt.target.classList.contains('active')) {
        reportFigures();
        break;
      }
    }
    if (debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function() {
      var h = contentHeight();
      if (Math.abs(h - lastHeight) > 10) {
        lastHeight = h;
        reportHeight();
        reportHeadings();
        reportScrollyRegions();
        // A height change means the page reflowed — a callout or code fold, an
        // image settling — and the figures moved with their text, so re-report
        // them; otherwise the canvas plates keep covering the spot the text
        // has flowed into.
        reportFigures();
        reportMermaidDiagrams();
      }
    }, 300);
  });

  // Follow <main>'s size as it changes, one report per frame, so the page on
  // the canvas grows and shrinks with a callout's own animation instead of
  // 300 ms after it. <main>, not body: body includes the height the parent
  // gives the frame, so observing it would feed back (measured on a chapter
  // and an exam: <main> is the same height in an 800 px and a 20000 px frame).
  var mainSizeFrame = 0;
  var mainSizeFollowed = false;
  function followMainSize() {
    var main = document.querySelector('main');
    if (mainSizeFollowed || !main || typeof ResizeObserver !== 'function') return;
    mainSizeFollowed = true;
    new ResizeObserver(function() {
      if (mainSizeFrame) return;
      mainSizeFrame = requestAnimationFrame(function() {
        mainSizeFrame = 0;
        var h = contentHeight();
        if (Math.abs(h - lastHeight) <= 10) return;
        lastHeight = h;
        reportHeight();
        reportHeadings();
        reportScrollyRegions();
        reportMermaidDiagrams();
      });
    }).observe(main);
  }

  // Start observing once DOM is ready
  function startObserver() {
    // <main> may not be parsed yet when body first exists.
    followMainSize();
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', followMainSize);
    observer.observe(document.body, {
      childList: true,
      subtree: true,
      attributes: true,
      characterData: false,
    });
  }

  if (document.body) {
    startObserver();
  } else {
    document.addEventListener('DOMContentLoaded', startObserver);
  }
})();
}
